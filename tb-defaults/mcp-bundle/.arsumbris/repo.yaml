# The agent/mcp framework bundle
# A pure AGGREGATOR node (au.engine.repo).
type: au.engine.repo::au-engine
name: mcp-bundle
description: aggregator for the agent/mcp framework type-def owners
deps:
  # The code owners retired on 2026-11-16 (`docs/detach-and-consolidate.md`): au-mcp (the Node daemon),
  # au-mcp-core (tool and hook definitions for a surface that no longer exists) and both adapters.
  # au-mcp-sdk remains as the vocabulary owner: its `type/` definitions are the language that
  # au-weave and au-rules notes are written in (`mcp.skill`, `mcp.inject`, `mcp.tool`, `agent-profile`).
  - name: au-mcp-sdk
