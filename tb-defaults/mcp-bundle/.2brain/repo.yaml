# The agent/mcp framework bundle
# A pure AGGREGATOR node (tb.engine.repo).
type: tb.engine.repo::tb-engine
name: mcp-bundle
description: aggregator for the agent/mcp framework type-def owners
deps:
  # The code owners retired on 2026-11-16 (`docs/detach-and-consolidate.md`): tb-mcp (the Node daemon),
  # tb-mcp-core (tool and hook definitions for a surface that no longer exists) and both adapters.
  # tb-mcp-sdk remains as the vocabulary owner: its `type/` definitions are the language that
  # tb-weave and tb-rules notes are written in (`mcp.skill`, `mcp.inject`, `mcp.tool`, `agent-profile`).
  - name: tb-mcp-sdk
