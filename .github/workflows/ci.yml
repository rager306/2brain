name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: MCP adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tb-mcp-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tb-mcp-rs
      # The adapter links the engine crates, so the engine's target dir is shared.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # `hotpath` is the only feature either crate has; measured at 0 findings on the tree of 2026-11-16, so
      # it is a gate rather than a stretch goal: a feature that only compiles one way is not gated at all.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      # `cargo test` skips the `#[ignore]`d real-engine suite, which is the only place the socket
      # path, the member gate and the cross-member grant run end to end. Build the engine binary
      # and point the suite at it; a regression there is otherwise invisible to CI.
      - name: real-engine tests
        run: |
          cargo build --manifest-path ../tb-engine/Cargo.toml -p tb-cli --bin au
          target=$(cargo metadata --manifest-path ../tb-engine/Cargo.toml --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          AU_ENGINE_BIN="$target/debug/au" cargo test --test real_engine -- --ignored

  engine:
    name: Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tb-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tb-engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test -p tb-core
      - run: cargo test -p tb-cli
      - run: cargo test -p tb-engine --lib
      - run: cargo test -p tb-engine --test it

  cards:
    name: Cards match their numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The SVGs are committed and drawn from tools/cards/metrics.json; a hand-edited card, or a
      # metrics file changed without re-rendering, fails here.
      - run: python3 tools/cards/render.py --check
