name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Format, Layers, Clippy, Tests & Licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify hexagonal layer boundaries
        run: python3 scripts/check_layer_deps.py
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (--all-features -D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace test suite
        run: cargo test --workspace --all-features
      - name: Validate truthful capability registry (U1/R23)
        run: python3 tools/check_capabilities.py
      - name: Run isolated black-box semantic acceptance suite (21 cases + SEM-48)
        run: |
          cargo build -p two-brain --bin 2brain
          BIN="$(cargo metadata --format-version=1 --no-deps | python3 -c 'import sys,json; print(json.load(sys.stdin)["target_directory"])')/debug/2brain"
          python3 tools/semantic/run_semantic_suite.py --bin "$BIN"
      - name: Check MIT-compatible licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2
        with:
          command: check licenses bans sources

  macos-check:
    name: macOS Portability Check (aarch64-apple-darwin)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
      - name: Check compilation on macOS (--all-targets --all-features)
        run: cargo check --workspace --all-targets --all-features
