name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Format, Layers, Clippy, Tests & Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify hexagonal layer boundaries
        run: python3 scripts/check_layer_deps.py
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace test suite
        run: cargo test --workspace
      - name: Validate truthful capability registry (U1/R23)
        run: python3 tools/check_capabilities.py
      - name: Run isolated black-box semantic acceptance suite (21 cases + SEM-48)
        run: |
          cargo build -p two-brain --bin 2brain
          BIN="$(cargo metadata --format-version=1 --no-deps | python3 -c 'import sys,json; print(json.load(sys.stdin)["target_directory"])')/debug/2brain"
          python3 tools/semantic/run_semantic_suite.py --bin "$BIN"
      - name: Check MIT-compatible licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
