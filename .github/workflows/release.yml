name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag label for dry-run artifact build"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-artifacts:
    name: Auditable Release + CycloneDX SBOM (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install supply-chain tools (cargo-auditable, cargo-cyclonedx, cargo-deny)
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-auditable,cargo-cyclonedx,cargo-deny
      - name: Verify MIT-compatible licenses and dependency bans
        run: cargo deny -L error check licenses bans sources
      - name: Build auditable release binary
        run: cargo auditable build --release --locked --target "${{ matrix.target }}" -p two-brain --bin 2brain
      - name: Generate CycloneDX 1.5 SBOM
        run: |
          mkdir -p dist
          cargo cyclonedx --manifest-path Cargo.toml --target "${{ matrix.target }}" --format json --spec-version 1.5 --describe binaries
          cp crates/bin/two-brain/*.cdx.json "dist/2brain-${{ matrix.target }}.cdx.json"
      - name: Package binary tarball and SHA-256 checksums
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          TARGET_DIR="$(cargo metadata --format-version=1 --no-deps | python3 -c 'import sys,json; print(json.load(sys.stdin)["target_directory"])')"
          BIN="${TARGET_DIR}/${TARGET_TRIPLE}/release/2brain"
          chmod +x "$BIN"
          COPYFILE_DISABLE=1 tar -C "${TARGET_DIR}/${TARGET_TRIPLE}/release" -czf "dist/2brain-${TARGET_TRIPLE}.tar.gz" 2brain
          python3 - <<'PY'
          import hashlib, os, pathlib
          target = os.environ["TARGET_TRIPLE"]
          dist = pathlib.Path("dist")
          lines = []
          for name in (f"2brain-{target}.tar.gz", f"2brain-{target}.cdx.json"):
              digest = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}")
          (dist / f"2brain-{target}.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
      - name: Attest build provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/2brain-${{ matrix.target }}.tar.gz
            dist/2brain-${{ matrix.target }}.cdx.json
            dist/2brain-${{ matrix.target }}.sha256
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Consolidate SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess

          tag = os.environ["TAG_NAME"]
          out = pathlib.Path("release-notes.md")
          changelog = pathlib.Path("CHANGELOG.md")
          notes = ""
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
              if m:
                  notes = m.group(1).strip()
                  notes = re.sub(r"\n---\s*$", "", notes).strip()
          if not notes:
              prev = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  capture_output=True, text=True,
              )
              rev_range = f"{prev.stdout.strip()}..{tag}" if prev.returncode == 0 and prev.stdout.strip() else tag
              log = subprocess.check_output(
                  ["git", "log", "--no-merges", "--pretty=format:- %s (%h)", rev_range],
                  text=True,
              ).strip()
              notes = f"### Changes\n{log}" if log else f"Release {tag}"
          out.write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GH_REPO" --title "2brain $TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" release-assets/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --repo "$GH_REPO" \
              --title "2brain $TAG_NAME" \
              --notes-file release-notes.md
          fi
