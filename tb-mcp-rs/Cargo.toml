[package]
name = "tb-mcp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "tb_mcp_rs"
path = "src/lib.rs"

[[bin]]
name = "2brain"
path = "src/bin/two_brain.rs"

[dependencies]
tb-cli = { path = "../tb-engine/crates/tb-cli" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
futures = "0.3"
rmcp = { version = "3.9", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3"

# Neither debug info nor incremental state is worth its disk here.
#
# Incremental state is never cacheable, and kache (installed as rustc-wrapper)
# only earns its keep on non-incremental units, so the whole workspace opts out:
# the redirected `incremental.kache-auto` directory had grown to 2.5 GiB of the
# 8.8 GiB target on 2026-11-15 for rebuilds that a cache hit serves better.
#
# Debug info: file and line only. Full DWARF for the dependency graph was the
# largest single cost in the shared target directory (~2 GiB of the 8.8 GiB
# measured on 2026-11-15) and buys nothing this project debugs with: backtraces
# and panic messages keep their locations, step-through variable inspection does
# not. `tb-engine` sets the same for its workspace; the two share one target
# directory, so they must agree or the dependency graph is compiled twice.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

# Release is what the scripts and the client matrix run; keep it optimised and
# small. The adapter is a thin layer over the engine, so thin LTO is enough.
[profile.release]
opt-level = 3
lto = "thin"
