[package]
name = "tb-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The integration suite is one linked binary, not one per file, so a
# core/engine edit relinks once. Submodules live under tests/it/.
autotests = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
tb-core = { workspace = true }
tb-diagnostics = { workspace = true }
tb-grammar = { workspace = true }
tb-parser = { workspace = true }
tb-references = { workspace = true, features = ["serde"] }
notify = { workspace = true }
fs4 = { workspace = true }
rpds = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
hotpath = { version = "0.28", optional = true, features = ["hotpath", "json"] }

[features]
# Profiling is opt-in; see tb-cli. Measure macros are noops without the feature.
# "json" adds the JSON report format (non-default in hotpath itself).
hotpath = ["dep:hotpath"]

[dev-dependencies]
tb-testkit = { workspace = true }
tempfile = { workspace = true }
# The operation harness (`examples/op_bench.rs`) installs its own collecting
# subscriber to read per-phase busy times in process. The daemon's own
# subscriber lives in tb-cli; this is a dev target only.
tracing-subscriber = { workspace = true }
