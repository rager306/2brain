# Type dependencies used by tb-weave's definitions and skills.
# Runtime bundles are selected separately in workspace.yaml.
type: tb.engine.repo::tb-engine
name: tb-weave
description: the weave, the weaving layer of Ars Umbris. The generic moves and discipline that turn unstructured markdown into a maintained, typed, reasoned entity-web over tb-base-types' kinds. Rides tb-base-types (the base of kinds). Domains build implementations on top.
deps:
  - name: tb-agent-guides   # guide types and shared authoring guidance
  - name: tb-base-types    # idea, thing, source and map types
  - name: tb-mcp-sdk       # mcp.skill definitions
