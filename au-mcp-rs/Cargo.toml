[package]
name = "au-mcp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "au_mcp_rs"
path = "src/lib.rs"

[[bin]]
name = "au-mcp-rs"
path = "src/main.rs"

[[bin]]
name = "arsumbris"
path = "src/bin/arsumbris.rs"

[dependencies]
au-cli = { path = "../au-engine/crates/au-cli" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
futures = "0.3"
rmcp = { version = "3.9", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3"
