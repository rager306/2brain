  - tb-mcp-rs/src/gate.rs
- id: 7561c9b6ddbcca00364004f8a4c2c778
  title: Agent instructions live in the closest AGENTS.md; the root file is a map
  decision: 'The root file keeps what applies everywhere: the layer split, live-system rules, gates, documentation
    kinds, and a pointer. Engine toolchain, crate map and build/test loop live in tb-engine/AGENTS.md;
    the adapter keeps a short pointer in tb-mcp-rs/AGENTS.md. The closest file wins.'
  reason: A merged instruction file has a hard budget and its accuracy falls as it grows; the code that
    needs the detail is also the directory whose file is read automatically.
  scope:
  - AGENTS.md
  - tb-engine/AGENTS.md
  - tb-mcp-rs/AGENTS.md
  currency: active
  source: agent
  accepted_at: '2026-11-18T09:44:33.408075'
  kind: agreement
  accepted_by: commandcode
  evidence:
  - AGENTS.md
  - tb-engine/AGENTS.md
- id: 7688c303cd37c7cf4db7da10262a5e89
  title: Rust is the only language on the serving path
  decision: 'The serving path is Rust end to end: tb-engine, tb-cli and tb-mcp-rs. No script, notebook
    or prototype sits on the request path.'
  reason: 'Tooling may drive the product but never be driven by it. A model that something other than
    a human reads has graduated: it is rewritten in the product''s language or moved into tooling with
    tests.'
  scope:
  - tb-engine
  - tb-mcp-rs
  currency: active
  source: agent
  accepted_at: '2026-11-18T09:08:09.544098'
  accepted_by: commandcode
  evidence:
