- id: 9242aa1915a02d0749797c35c516bbd9
  title: Files are authoritative; the graph is derived and rebuildable
  decision: Markdown files in Git are the truth. The typed graph is derived from them at build time and
    rebuilt from scratch when the engine restarts or a file changes.
  reason: Deleting the graph loses nothing. It also makes the format reviewable in a pull request and
    editable in any editor.
  scope:
  - tb-engine
  currency: active
  source: agent
