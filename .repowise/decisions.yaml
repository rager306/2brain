  - docs/internal/detach-and-consolidate.md
- id: 86a36bdebc5c654a0362780d9a3c3fbf
  title: 'One forward view: the roadmap plans, the trajectory logs'
  decision: docs/roadmap.md is the only page that says what happens next, with stages, exit criteria and
    the parallel groups. docs/trajectory.md keeps the dated log of what landed and why. A design page
    that once carried a plan keeps its reasoning and points at the roadmap for the plan.
  reason: A forward view that exists twice drifts once; the reader then has to diff two documents to learn
    the truth.
  scope:
  - docs/architecture-plan.md
  - docs/roadmap.md
  - docs/trajectory.md
  currency: active
  source: agent
  accepted_at: '2026-11-18T09:32:12.906817'
  kind: agreement
  accepted_by: commandcode
