- id: 7688c303cd37c7cf4db7da10262a5e89
  title: Rust is the only language on the serving path
  decision: 'The serving path is Rust end to end: tb-engine, tb-cli and tb-mcp-rs. No script, notebook
    or prototype sits on the request path.'
  reason: 'Tooling may drive the product but never be driven by it. A model that something other than
    a human reads has graduated: it is rewritten in the product''s language or moved into tooling with
    tests.'
  scope:
  - tb-engine
  - tb-mcp-rs
  currency: active
  source: agent
