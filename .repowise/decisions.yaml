- id: f509edacf6f943ac4629b9399e676ec5
  title: The engine schema is tb.engine.*, and the legacy spelling is accepted but named
  decision: Writers emit tb.engine.*; readers accept au.engine.* and canonicalize it; a claim written
    in the legacy spelling carries one hint (engine-schema-legacy-spelling) whose fix names the canonical
    form.
  reason: The window has to be open for reading and visible for editing. Refusing it outright is a release
    decision, not a code one, and the advisory is what makes that decision safe.
  scope:
  - docs/research/release-2-window-2026-11-17.md
