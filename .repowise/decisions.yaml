- id: 4b38743c80b4b46ccf0664cd271c9bd3
  title: Mutations go through one gate that names the stage that refused
  decision: Every mutation passes ordered stages (arguments, path_scope, member_grant, prior_read, freshness,
    editability, capacity) and a failure names its stage as policy/<stage>, in the tool's own words.
  reason: The gate's order and answers are a pure reduction over data the process already holds, so they
    are testable without a socket, and a caller can act on the message.
  scope:
  - docs/research/write-contracts.md
  - tb-mcp-rs/src/gate.rs
  - tb-mcp-rs/src/policy.rs
  currency: active
  source: agent
