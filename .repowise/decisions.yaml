- id: 1d0b8bda2889ffa021020354acd7a724
  title: A measurement names its instrument, and a rejected change is recorded
  decision: Every metric states what it counts, the command that produced it, and the date. A change that
    was measured and refused is written down with its numbers rather than deleted.
  reason: The record of a refusal stops the same idea being re-tried every month, and it is the only defence
    against a plausible number that measures nothing.
  scope:
  - docs/research/measurement-doctrine.md
  - tools/cards/metrics.json
  - tools/cards/render.py
  currency: active
  source: agent
